    <h1>Formulario de Contacto</h1>
    <form action="#">
        <h1>Ingresa tus datos</h1>
        <p>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </p>
        <p>
            <label for="correo">Correo electrónico:</label><br>
            <input type="email" id="correo" name="correo" required>
        </p>
        <p><label for="Telefono">Numero Telefonico:</label><br>
            <input type="numero id="numero" name="numero" required>
         </p>
        <p>
            <label for="solicitud">Tipo de solicitud:</label><br>
            <select id="solicitud" name="solicitud" required>
                <option value="">-- Selecciona una opción --</option>
                <option value="Compra">Compra</option>
                <option value="Consulta">Consulta</option>
                <option value="Venta">Venta</option>
            </select>
        </p>
        <p>
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="4" cols="40" required></textarea>
        </p>
        <button type="submit">Enviar Mensaje</button>
    </form>
